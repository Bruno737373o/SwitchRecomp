schema_version = "1"

[inputs]
mode = "lifted"
module_json = "samples/minimal/module.json"
provenance = "samples/minimal/provenance.toml"
config = "samples/minimal/title.toml"
runtime_path = "crates/recomp-runtime"

[outputs]
work_root = "out/automation-minimal"

[reference]
reference_video_toml = "samples/reference_video.toml"
capture_video_toml = "samples/capture_video.toml"
validation_config_toml = "samples/validation_config.toml"

[capture]
video_path = "artifacts/capture/capture.mp4"
frames_dir = "artifacts/capture/frames"
audio_file = "artifacts/capture/audio.wav"

[commands]
build = ["/bin/sh", "-lc", "cargo build --manifest-path \"$RECOMP_BUILD_DIR/Cargo.toml\""]
run = ["/bin/sh", "-lc", "cargo run --manifest-path \"$RECOMP_BUILD_DIR/Cargo.toml\""]
capture = ["/bin/sh", "-lc", "scripts/capture-video-macos.sh \"$(dirname \"$RECOMP_CAPTURE_VIDEO\")\""]
extract_frames = ["/bin/sh", "-lc", "ffmpeg -i \"$RECOMP_CAPTURE_VIDEO\" \"$RECOMP_CAPTURE_FRAMES_DIR/%08d.png\""]
extract_audio = ["/bin/sh", "-lc", "ffmpeg -i \"$RECOMP_CAPTURE_VIDEO\" -vn -acodec pcm_s16le \"$RECOMP_CAPTURE_AUDIO_FILE\""]

[run]
resume = true
lift_entry = "entry"
lift_mode = "decode"
