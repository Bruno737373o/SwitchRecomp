name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - run: cargo run -p recomp-validation -- --out-dir artifacts/validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-report
          path: artifacts/validation

  android:
    name: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.3.11579264" "platforms;android-34" > /dev/null
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Emit memory-image sample
        run: >
          cargo run -p recomp-cli -- run
          --module samples/memory-image/module.json
          --config samples/memory-image/title.toml
          --provenance samples/memory-image/provenance.toml
          --out-dir out/memory-image
      - name: Build APK
        run: >
          cargo run -p recomp-cli -- android
          --project-dir out/memory-image
          --out-dir out/android-memory-image
          --build
      - uses: actions/upload-artifact@v4
        with:
          name: android-memory-image-apk
          path: out/android-memory-image/app/build/outputs/apk/debug/app-debug.apk
